#cloud-config
# Provisions an Ubuntu VM for Inheritance Engine (any cloud-init capable host). Only SSH is open to the internet.
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - git
  - ufw
runcmd:
  - ufw default deny incoming
  - ufw allow OpenSSH
  - ufw --force enable
  - systemctl enable --now docker
  - mkdir -p /srv/inheritance-engine/data
  - git clone https://github.com/shaileshvats/inheritance-engine.git /opt/inheritance-engine
  - cd /opt/inheritance-engine/deploy/self-host && docker compose up -d --build
