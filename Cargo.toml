[package]
name = "inheritance-engine"
version = "0.1.0"
edition = "2021"
description = "Find forgotten software. Understand it. Restore it. Give it a future."
license-file = "LICENSE"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sentry = { version = "0.49", default-features = false, features = ["reqwest", "rustls", "contexts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
sentry = { version = "0.49", default-features = false, features = ["test"] }

[profile.dev.package."*"]
opt-level = 2
